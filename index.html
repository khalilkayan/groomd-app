/* Escape untrusted text for HTML text nodes and quoted attribute values.
   null/undefined become '' but every other value (0, false, '') is preserved. */
function esc(v){
  if(v===null||v===undefined) return '';
  return String(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
/* Escape a value that lands inside a single-quoted JS string which is itself
   inside a double-quoted HTML attribute (e.g. onclick="fn('HERE')").
   JS-escape first, then HTML-escape, so the attribute decode step can't
   re-introduce a quote that closes the JS string. */
function escJs(v){
  if(v===null||v===undefined) return '';
  return esc(String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]/g,' '));
}

// Current wall-clock time in Beirut (handles DST via Intl); falls back to device local time.
function beirutNow(){
  try{
    const p={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Beirut',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
    return {y:+p.year,m:+p.month-1,d:+p.day,h:+(p.hour==='24'?0:p.hour),min:+p.minute};
  }catch(e){const n=new Date();return {y:n.getFullYear(),m:n.getMonth(),d:n.getDate(),h:n.getHours(),min:n.getMinutes()};}
}
function slotToMin(t){const a=t.split(':');return (+a[0])*60+(+a[1]);}
const LAST_SLOT_MIN=Math.max(...Object.values(TSLOTS).flat().map(slotToMin));
// Dynamically build the next N bookable calendar days from the real current date (Beirut time).
function buildDates(daysAhead=30){
  const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MON_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const bn=beirutNow();
  // Include today only if at least one time slot is still ahead today; otherwise start from tomorrow.
  const includeToday=(bn.h*60+bn.min) < LAST_SLOT_MIN;
  const startOffset=includeToday?0:1;
  const result=[];
  for(let k=0;k<daysAhead;k++){
    const i=startOffset+k;
    const d=new Date(bn.y,bn.m,bn.d+i);
    const dayName=DAY_NAMES[d.getDay()],monName=MON_NAMES[d.getMonth()];
    const label=i===0?'Today':i===1?'Tomorrow':dayName;
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    result.push({label,sub:`${dayName} ${d.getDate()} ${monName}`,day:String(d.getDate()),month:monName,year:d.getFullYear(),iso,dateObj:d,isToday:i===0});
  }
  return result;
}
let DATES=buildDates();
function refreshDates(){DATES=buildDates();return DATES;}
// Sample "upcoming" bookings + the confirmation notification are declared before DATES exists,
// so patch them once here to use fresh dynamic dates (completed bookings stay in the past).
(function seedSampleDates(){
  if(typeof userBookings==='undefined') return;
  const slots=[{i:1,t:'10:00'},{i:3,t:'14:30'},{i:5,t:'16:00'}];
  let s=0;
  userBookings.forEach(b=>{
    if(b.status==='upcoming'){
      const pick=slots[s%slots.length]; s++;
      const d=DATES[pick.i]||DATES[s]||DATES[0];
      if(d){ b.date=d.sub; b.iso=d.iso; b.time=pick.t; }
    }
  });
  const firstUp=userBookings.find(b=>b.status==='upcoming');
  if(firstUp && typeof notifications!=='undefined'){
    const n=notifications.find(x=>x.title==='Booking Confirmed');
    if(n) n.body=`Your ${firstUp.service} at ${firstUp.business} is confirmed for ${firstUp.date} at ${firstUp.time}.`;
  }
})();

function groupByBusinessId(rows, mapper) {
  return rows.reduce((acc, row) => {
    const id = row.business_id;
    if (!acc[id]) acc[id] = [];
    acc[id].push(mapper(row));
    return acc;
  }, {});
}
function supabaseHeaders(extra = {}) {
  const token = authSession?.access_token || SUPABASE_ANON_KEY;
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token}`,
    'Content-Type': 'application/json',
    ...extra
  };
}
async function fetchSupabaseTable(tableName, query = '') {
  const url = `${SUPABASE_URL}/rest/v1/${tableName}${query}`;
  const res = await fetch(url, {
    method: 'GET',
    headers: supabaseHeaders()
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`${tableName} failed: ${res.status} ${text}`);
  }
  const data = await res.json();
  console.log(`Loaded table: ${tableName} rows=${data.length}`);
  return data;
}

async function insertSupabaseRow(tableName, payload, prefer = 'return=representation') {
  const url = `${SUPABASE_URL}/rest/v1/${tableName}`;

  const res = await fetch(url, {
    method: 'POST',
    headers: supabaseHeaders({ Prefer: prefer }),
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const text = await res.text();
    const error = new Error(`${tableName} insert failed: ${res.status} ${text}`);
    error.status = res.status;
    error.responseText = text;
    throw error;
  }

  const text = await res.text();
  const data = text ? JSON.parse(text) : [];

  console.log(`Inserted into ${tableName}: rows=${Array.isArray(data) ? data.length : 0}`);
  return data;
}
async function updateSupabaseRow(tableName, query, payload) {
  const url = `${SUPABASE_URL}/rest/v1/${tableName}${query}`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: supabaseHeaders({ Prefer: 'return=representation' }),
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const text = await res.text();
    const error = new Error(`${tableName} update failed: ${res.status} ${text}`);
    error.status = res.status;
    error.responseText = text;
    throw error;
  }
  const data = await res.json();
  console.log(`Updated ${tableName}: rows=${Array.isArray(data) ? data.length : 0}`);
  return data;

  if (!supabaseAuthClient) { console.warn('AUTH_UNAVAILABLE: Supabase auth client not loaded.'); authReady = true; return; }
  try {
    const { data, error } = await supabaseAuthClient.auth.getSession();
    if (error) console.warn('AUTH_GET_SESSION_ERROR:', error.message);

    authSession = data?.session || null;
    authUser = authSession?.user || null;
    authReady = true;

    syncUserProfileFromAuth();

    supabaseAuthClient.auth.onAuthStateChange((event, session) => {
      console.log('AUTH_STATE_CHANGED:', event, session ? 'signed-in' : 'signed-out');
      authSession = session || null;
      authUser = session?.user || null;
      syncUserProfileFromAuth();
      if (authUser) {
        loadMyBookingsFromBackend();
      } else {
        // Logged out: drop the logged-in user's backend bookings, keep local/guest session ones.
        userBookings = userBookings.filter(b => !b.backendId);
        render();
      }
      render();
    });
  } catch (err) {
    console.warn('AUTH_INIT_ERROR:', err?.message || String(err));
    authReady = true;
  }
}
function syncUserProfileFromAuth() {
  if (!authUser) {
    userProfile.name = '';
    userProfile.email = '';
    userProfile.phone = '';
    return;
  }
  userProfile.email = authUser.email || '';
  userProfile.name =
    authUser.user_metadata?.full_name ||
    authUser.user_metadata?.name ||
    '';
  userProfile.phone =
    authUser.user_metadata?.phone ||
    '';
}

async function saveBookingToBackend(booking) {
  const payload = {
    business_id: booking.bizId,
    business_name: booking.business,
    service_name: booking.service,
    staff_name: booking.staff || null,
    booking_date: booking.iso || null,
    booking_time: booking.time || null,
    price: booking.price || null,
    status: booking.status || 'upcoming',
    customer_id: authUser?.id || null,
    customer_name: userProfile?.name || authUser?.user_metadata?.full_name || null,
    customer_phone: userProfile?.phone || authUser?.user_metadata?.phone || S.phone || null,
    customer_email: authUser?.email || userProfile?.email || null,
    payment_method: booking.payment || bkSel.payment || 'cash',
    note: bkSel.note || null
  };
  if (!payload.business_id || !payload.business_name || !payload.service_name || !payload.booking_date || !payload.booking_time) {
    console.warn('BOOKING_PAYLOAD_MISSING_REQUIRED_FIELDS:',
      ['business_id','business_name','service_name','booking_date','booking_time'].filter(k => !payload[k]).join(','));
    showToast('Booking saved locally');
    return null;
  }
  try {
    const savedBooking = await insertSupabaseRow(
  'bookings',
  payload,
  authUser ? 'return=representation' : 'return=minimal'
);
    console.log('BOOKING_SAVED_TO_SUPABASE: rows=' + (Array.isArray(savedBooking) ? savedBooking.length : 0));
    showToast('Booking saved');
    return savedBooking?.[0] || null;
  } catch (err) {
    const msg = err?.message || String(err);
    const raw = err?.responseText || '';
    if (err?.status === 409 || raw.includes('23505') || raw.includes('bookings_no_double_active_slot') || msg.includes('23505')) {
      console.warn('BOOKING_SLOT_TAKEN');
      showToast('This slot is already booked');
      return 'slot_taken';
    }
    console.warn('BOOKING_SAVE_ERROR: status=' + (err?.status || 'unknown'));
    showToast('Booking saved locally');
    return null;
  }
}

// Fetch the active (pending/upcoming/confirmed) booked times for a given business+staff+date,
// so the time picker can show them as unavailable. Same staff_name logic as isSlotTakenBackend().
async function loadTakenSlotsForSelection(businessId, staffName, bookingDate) {
  const safeStaff = staffName || 'Any';
  const key = `${businessId}|${safeStaff}|${bookingDate}`;

  takenSlotsKey = key;

  console.log('TAKEN_SLOTS_LOAD:', { businessId, staffName, bookingDate });

  if (!businessId || !bookingDate) {
    takenSlots = [];
    takenSlotsLoading = false;
    render();
    return;
  }

  takenSlotsLoading = true;

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_booked_slots`, {
      method: 'POST',
      headers: supabaseHeaders(),
      body: JSON.stringify({
        p_business_id: businessId,
        p_staff_name: safeStaff,
        p_booking_date: bookingDate
      })
    });

    if (!res.ok) {
      const text = await res.text();
      console.warn('TAKEN_SLOTS_ERROR: status=' + res.status);

      if (takenSlotsKey === key) {
        takenSlots = [];
        takenSlotsLoading = false;
        render();
      }

      return;
    }

    const rows = await res.json();

    const slots = Array.isArray(rows)
      ? rows.map(r => (r.booking_time || '').slice(0, 5))
      : [];

    console.log('TAKEN_SLOTS:', slots);

    if (takenSlotsKey === key) {
      takenSlots = slots;
      takenSlotsLoading = false;
      render();
    }
  } catch (err) {
    console.warn('TAKEN_SLOTS_EXCEPTION:', err?.message || String(err));

    if (takenSlotsKey === key) {
      takenSlots = [];
      takenSlotsLoading = false;
      render();
    }
  }
}
async function isSlotTakenBackend(businessId, staffName, bookingDate, bookingTime) {
  try {
    if (!businessId || !bookingDate || !bookingTime) return false;

    const safeStaff = staffName || 'Any';

    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_booked_slots`, {
      method: 'POST',
      headers: supabaseHeaders(),
      body: JSON.stringify({
        p_business_id: businessId,
        p_staff_name: safeStaff,
        p_booking_date: bookingDate
      })
    });

    if (!res.ok) {
      const text = await res.text();
      console.warn('SLOT_CHECK_ERROR: status=' + res.status);
      return false;
    }

    const rows = await res.json();

    const slots = Array.isArray(rows)
      ? rows.map(r => (r.booking_time || '').slice(0, 5))
      : [];

    console.log('SLOT_CHECK_ROWS:', slots);

    return slots.includes(bookingTime);
  } catch (err) {
    console.warn('SLOT_CHECK_EXCEPTION:', err?.message || String(err));
    return false;
  }
}
async function cancelBookingBackend(booking) {
  if (!booking?.backendId && !booking?.id) {
    console.warn('CANCEL_BOOKING_MISSING_ID');

  const backendId = booking.backendId || booking.id;
  try {
    const updated = await updateSupabaseRow(

    showToast('Booking cancelled');
    return updated?.[0] || null;
  } catch (err) {
    console.warn('BOOKING_CANCEL_ERROR: ' + (err?.message || String(err)));
    showToast('Cancelled locally');
    return null;
  }
}
function formatBookingDateLabel(isoDate) {
  if (!isoDate) return '';
  try {
    const d = new Date(isoDate + 'T12:00:00');
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
  } catch (e) {
    return isoDate;
  }
}

async function updateDashboardBookingStatus(id, newStatus) {
  console.log('DASHBOARD_ACTION_CLICKED:', id, newStatus);
  const booking = dashboardBookings.find(b => String(b.id) === String(id) || String(b.backendId) === String(id));
  if (!booking) return;
  const oldStatus = booking.status;
  booking.status = newStatus;
  render();
  try {
    const backendId = booking.backendId || booking.id;
    const updated = await updateSupabaseRow(
      'bookings',
      `?id=eq.${encodeURIComponent(backendId)}`,
      { status: newStatus }
    );
    if (!updated || !updated.length) {
      throw new Error('Dashboard status update returned no rows. Wrong backend id?');
    }
    booking.status = newStatus;
    console.log('DASHBOARD_BOOKING_STATUS_UPDATED: rows=' + updated.length);
    showToast(`Booking ${newStatus}`);
    await loadDashboardBookings(dashboardBusinessId);
    await loadMyBookingsFromBackend();
    takenSlotsKey = ''; // status change affects slot availability -> refresh taken slots
    render();
  } catch (err) {
    booking.status = oldStatus;
    console.warn('DASHBOARD_BOOKING_STATUS_UPDATE_ERROR: ' + (err?.message || String(err)));
    showToast('Status update failed');
    render();
  }
}
async function saveOwnerManualBooking() {
  if (!authUser) { showToast('Business login required'); return; }
  if (!ownedBusinessIds.includes(Number(dashboardBusinessId))) { showToast('No business access'); return; }
  const mode = ownerBookingMode === 'block' ? 'block' : 'manual';
  const biz = getBusinesses().find(b => b.id === dashboardBusinessId);
  if (!biz) { showToast('Select a business'); return; }
  const services = getBusinessServices(dashboardBusinessId) || [];
  const staffList = getBusinessStaff(dashboardBusinessId) || [];
  const staffName = ownerBookingStaff === -1 ? 'Any' : (staffList[ownerBookingStaff]?.name || 'Any');
  const dateObj = ownerBookingDate !== null ? DATES[ownerBookingDate] : null;
  const bookingDate = dateObj?.iso || '';
  const bookingTime = ownerBookingTime || '';
  if (!bookingDate || !bookingTime || !staffName || !mode) { showToast('Pick date, time and staff'); return; }

  const svc = services[ownerBookingService];
  const serviceName = mode === 'block' ? 'Blocked Slot' : (svc?.name || 'Service');
  const price = mode === 'block' ? '$0' : (svc?.price || '$0');
  const customerName = mode === 'block'
    ? 'Blocked Slot'
    : (ownerBookingCustomerName.trim() || 'Manual Booking');
  const note = (ownerBookingNote || '').trim()
    ? ownerBookingNote.trim()
    : (mode === 'block' ? 'Blocked by business' : 'Manual booking added by business');

  ownerBookingSaving = true; render();
  try {
    const taken = await isSlotTakenBackend(biz.id, staffName, bookingDate, bookingTime);
    if (taken) {
      ownerBookingSaving = false;
      showToast('This slot is already booked');
      render();
      return;
    }
    const payload = {
      business_id: biz.id,
      business_name: biz.name,
      service_name: serviceName,
      staff_name: staffName,
      booking_date: bookingDate,
      booking_time: bookingTime,
      price: price,
      status: 'confirmed',
      customer_id: null,
      customer_name: customerName,
      customer_phone: (mode === 'manual' && ownerBookingPhone.trim()) ? ownerBookingPhone.trim() : null,
      customer_email: null,
      payment_method: 'manual',
      note: note
    };
    const saved = await insertSupabaseRow('bookings', payload, 'return=representation');
    console.log('OWNER_MANUAL_BOOKING_SAVED: rows=' + (Array.isArray(saved) ? saved.length : 0));
    showToast(mode === 'block' ? 'Slot blocked' : 'Booking added');
    ownerBookingOpen = false;
    ownerBookingMode = 'manual';
    ownerBookingService = 0;
    ownerBookingStaff = -1;
    ownerBookingDate = null;
    ownerBookingTime = '';
    ownerBookingCustomerName = '';
    ownerBookingPhone = '';
    ownerBookingNote = '';
    ownerBookingSaving = false;
    dashboardStatusFilter = 'all';
    await loadDashboardBookings(dashboardBusinessId);
    render();
  } catch (err) {
    console.warn('OWNER_MANUAL_BOOKING_ERROR: status=' + (err?.status || 'unknown'));
    ownerBookingSaving = false;
    showToast('Could not save booking');
    render();
  }
}

function showToast(msg,icon=''){
  let t=document.getElementById('glamo-toast');
  if(!t){t=document.createElement('div');t.id='glamo-toast';
    t.style.cssText='position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A1611;color:#FAF7F2;padding:11px 20px;border-radius:30px;font-size:12px;font-weight:600;font-family:system-ui;letter-spacing:0.04em;z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,0.3);border:1px solid rgba(184,150,90,0.3);opacity:0;transition:all .25s ease;white-space:nowrap;pointer-events:none';
    document.body.appendChild(t);}
  while(t.firstChild) t.removeChild(t.firstChild);
  if(icon){
    const s=document.createElement('span');
    s.style.fontSize='14px';
    // Only trustedIcon() markup reaches innerHTML; any plain value stays text.
    if(typeof icon==='object' && typeof icon.html==='string') s.innerHTML=icon.html;
    else s.textContent=String(icon);
    t.appendChild(s);
    t.appendChild(document.createTextNode(' '));
  }
  t.appendChild(document.createTextNode(msg===null||msg===undefined?'':String(msg)));
  t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(12px)';},2200);
}

// Safe numeric value for price strings ("$15","From $70" -> number; "Price on request"/blank -> sorts last)
function priceValue(price){
  const n=parseInt(String(price||'').replace(/[^0-9]/g,''),10);
  return Number.isFinite(n)?n:999999;
}

function scBusiness(){
  const b=getBusinesses().find(x=>x.id===S.bizId)||getBusinesses()[0]||BIZ[0];
  function tabContent(){
    if(bpTab==='services') return bpSvc();
    if(bpTab==='team') return bpTeam();

    const bizSvcs = BIZ_SVCS[b.id] || CAT_SVCS[b.cid] || SVCS;

      <div>

/* ============================

============================ */
function bkTop(title){
  return `<div style="display:flex;align-items:center;gap:12px;padding:10px 22px 0;flex-shrink:0">
    <div class="tap" onclick="bkBack()" style="width:36px;height:36px;border-radius:50%;background:${SF};border:1px solid ${BD};display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${DK}" stroke-width="2.2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </div>
    <div><div style="font-size:10px;color:${MU};letter-spacing:0.07em;font-weight:600">${currentBiz().name.toUpperCase()} &middot; ${currentBiz().loc.toUpperCase()}</div><div style="font-size:17px;color:${DK};font-family:Georgia,serif">${title}</div></div>
  </div>`;
}
function stepBar(){
  const labels=['Service','Specialist','Date & Time','Details','Confirm'];
  return `<div style="display:flex;align-items:center;justify-content:center;gap:3px;padding:14px 18px 0;flex-shrink:0">
    ${labels.map((l,i)=>{const n=i+1,done=bkStep>n,active=bkStep===n;return `<div style="display:flex;align-items:center;gap:3px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
        <div style="width:24px;height:24px;border-radius:50%;background:${done?G:active?DK:SF};border:1.5px solid ${done?G:active?DK:BD};display:flex;align-items:center;justify-content:center">
          ${done?`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="${CR}" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`:`<span style="font-size:10px;color:${active?CR:MU};font-weight:700">${n}</span>`}
        </div>
        <span style="font-size:8px;color:${active?DK:done?G:MU};font-weight:${active?700:400};white-space:nowrap">${l}</span>
      </div>
      ${i<4?`<div style="width:14px;height:1.5px;background:${done?G:BD};margin-bottom:14px"></div>`:''}
    </div>`;}).join('')}
  </div>`;
}
function cta(label,on,action){
  return `<div style="position:absolute;bottom:0;left:0;right:0;background:${CR};border-top:1px solid ${BD};box-shadow:0 -10px 26px rgba(26,22,17,0.07);padding:16px 22px 28px">
    <div ${on?`onclick="${action}"`:''}  style="background:${on?DK:'#C8C2BA'};border-radius:15px;padding:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:${on?'pointer':'default'}">
      <span style="font-size:13.5px;color:${CR};font-weight:700;letter-spacing:0.05em">${label}</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${CR}" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
  </div>`;
}

function scBooking(){
  if(bkStep===6) return scConfirmed();
  if(bkStep===1) return `<div style="display:flex;flex-direction:column;height:100%">
    ${sbar()}${bkTop('Choose a Service')}${stepBar()}

  return `<div style="display:flex;flex-direction:column;min-height:100%">

function getGreeting(){
  const h=new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<18) return 'Good afternoon';
  return 'Good evening';
}
function submitAuth(){
  const nameEl=document.getElementById('inp-name');
  const emailEl=document.getElementById('inp-email');
  const phoneEl=document.getElementById('inp-phone');
  const passEl=document.getElementById('inp-pass');
  const errEl=document.getElementById('auth-error');
  const phone=phoneEl?phoneEl.value.trim():'';
  const pass=passEl?passEl.value.trim():'';
  if(authMode==='signup'){
    const name=nameEl?nameEl.value.trim():'';
    const email=emailEl?emailEl.value.trim():'';
    if(!name){showAuthError('Please enter your full name.');return;}
    if(!email||!email.includes('@')){showAuthError('Please enter a valid email address.');return;}
    if(!phone||phone.length<6){showAuthError('Please enter a valid phone number.');return;}
    if(!pass||pass.length<6){showAuthError('Password must be at least 6 characters.');return;}
    userProfile={name:name,phone:phone,email:email,joined:new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})};
  } else {
    if(!phone||phone.length<6){showAuthError('Please enter your phone number.');return;}
    if(!pass){showAuthError('Please enter your password.');return;}
    if(!userProfile.name) userProfile={name:'User',phone:phone,email:'',joined:'May 2026'};
  }
  if(authMode==='signup'&&!userLocation.area){
    S.screen='location';
  } else {
    S.screen='welcome';
  }
  render();
}

/* ── Distance helpers ── */
function haversine(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function distanceToBiz(biz){
  if(!userLocation.lat||!biz.lat) return null;
  const d=haversine(userLocation.lat,userLocation.lng,biz.lat,biz.lng);
  return d<0.1?'0.1 km':d<10?d.toFixed(1)+' km':Math.round(d)+' km';
}
function getLocation(){
  if(!navigator.geolocation){showToast('Pick your area below',trustedIcon('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>'));return;}
  showToast('Detecting location…',trustedIcon('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>'));
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const {latitude:lat,longitude:lng}=pos.coords;
      let closest=null,minD=Infinity;
      AREAS.forEach(a=>{const d=haversine(lat,lng,a.lat,a.lng);if(d<minD){minD=d;closest=a;}});
      if(closest){
        userLocation={area:closest.name,label:areaLabel(closest.name),lat:closest.lat,lng:closest.lng};
        showToast('Location set to '+closest.name,trustedIcon('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>'));
      }
      S.screen='home';render();
    },

function initGlamoMap(){
  if(typeof L==='undefined'||!document.getElementById('glamo-map')) return;
  if(_glamoMap){_glamoMap.remove();_glamoMap=null;}

  const map=L.map('glamo-map',{zoomControl:false,attributionControl:false})
    .setView([33.888,35.501],14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
  }).addTo(map);

  // Gold draggable pin
  const goldIcon=L.divIcon({
    html:`<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);background:#B8965A;border:3px solid #FAF7F2;
      box-shadow:0 3px 10px rgba(0,0,0,0.35);position:relative">
      <div style="width:10px;height:10px;border-radius:50%;background:#FAF7F2;
        position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg)"></div>
    </div>`,
    className:'',iconSize:[30,30],iconAnchor:[15,30]
  });

  const marker=L.marker([33.888,35.501],{draggable:true,icon:goldIcon}).addTo(map);
  _glamoMarker=marker;

  function updateArea(lat,lng){
    _pickedLat=lat; _pickedLng=lng;
    let closest=null,minD=Infinity;
    AREAS.forEach(a=>{
      const d=haversine(lat,lng,a.lat,a.lng);
      if(d<minD){minD=d;closest=a;}
    });
    _pickedArea=closest;
    const el=document.getElementById('map-area-label');
    if(el&&closest){
      el.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="#B8965A">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
        <span style="font-size:13px;color:#1A1611;font-weight:600">${areaLabel(closest.name)}</span>
        <span style="font-size:11px;color:#A8997E;margin-left:4px">${minD<10?minD.toFixed(1)+'km away':''}</span>`;
    }
  }

  marker.on('dragend',e=>{const ll=e.target.getLatLng();updateArea(ll.lat,ll.lng);});
  map.on('click',e=>{marker.setLatLng(e.latlng);updateArea(e.latlng.lat,e.latlng.lng);});

  // Try real GPS
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude:lat,longitude:lng}=pos.coords;
        map.setView([lat,lng],15);
        marker.setLatLng([lat,lng]);
        updateArea(lat,lng);
      },
      ()=>updateArea(33.888,35.501),
      {timeout:6000}
    );
  } else {
    updateArea(33.888,35.501);
  }

  _glamoMap=map;
}

            <div style="background:${DK};border-radius:9px;padding:7px 13px;
              font-size:10px;color:${CR};font-weight:700">RESERVE</div>
          </div>
        </div>`).join('')}
      </div>

    </div>`}

    ${bnav()}
  </div>`;
}

function goBack(){
  if(S.screen==='business'){S.screen='category';render();return;}
  if(S.screen==='category'){S.screen='home';render();return;}
  if(S.screen==='booking'){if(bkStep>1){bkStep--;render();}else{S.screen='business';render();}return;}
  if(S.screen==='search'){S.screen='home';render();return;}
  if(S.screen==='bookings'){S.screen='home';render();return;}
  if(S.screen==='booking-detail'){S.screen='bookings';render();return;}
  if(S.screen==='saved'){S.screen='home';render();return;}
  if(S.screen==='profile'){S.screen='home';render();return;}
  if(S.screen==='login'){S.screen='home';render();return;}
  if(S.screen==='location'){S.screen='home';render();return;}
  if(S.screen==='map-picker'){S.screen='location';render();return;}
  if(S.screen==='social-name'){S.screen='login';render();return;}
  S.screen='home';render();
}
function navTab(tab){S.tab=tab;if(tab==='bookings'){S.screen='bookings';}else if(tab==='search'){S.screen='search';}else if(tab==='saved'){S.screen='saved';}else if(tab==='profile'){S.screen='profile';}else{S.screen='home';}render();}
function gotoHome(){S.screen='home';render();}
function goto(sc){S.screen=sc;render();}
function openCat(id){S.category=id;S.screen='category';render();}
function openBiz(id){S.bizId=id;S.screen='business';bpTab='services';render();}
function startBooking(svcIdx=null,staffIdx=null){
  refreshDates();
  S.screen='booking';
  bkSel={service:svcIdx,staff:staffIdx,date:null,slot:null,payment:'cash',note:''};
  bkStep = (svcIdx!==null && staffIdx!==null) ? 3 : (svcIdx!==null ? 2 : 1);
  render();
}
async function bkNext(){
  if(bkStep===1 && bkSel.service!==null && bkSel.staff!==null){bkStep=3;render();return;}
  if(bkStep<6){
    if(bkStep===5){
      const ok = await addBooking();
      if(ok === false){ return; }
      bkStep=6;
      setTimeout(()=>showToast(rewardUnlocked?'Reward unlocked! ★':'+'+lastEarnedPoints+' points earned',trustedIcon('<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>')),400);
      render();
      return;
    }
    bkStep++;
    render();
  }
}
function bkBack(){if(bkStep>1){bkStep--;render();}else{S.screen='business';render();}}

function openBookingDetail(id){activeBookingId=id;S.screen='booking-detail';render();}
function cancelBooking(id){const b=userBookings.find(x=>x.id===id||x.backendId===id);if(!b)return;b.status='cancelled';cancelBookingBackend(b);takenSlotsKey='';S.screen='bookings';render();}
function earnLoyalty(){
  // Award points
  LOYALTY.points += POINTS_PER_BOOKING;
  lastEarnedPoints = POINTS_PER_BOOKING;
  LOYALTY.visits += 1;
  rewardUnlocked = false;
  // Fill next stamp; if card complete, reset + unlock reward
  const nextEmpty = LOYALTY.stamps.indexOf(false);
  if(nextEmpty === -1){
    LOYALTY.stamps = [true,false,false,false,false];
    rewardUnlocked = true;
  } else {
    LOYALTY.stamps[nextEmpty] = true;
    if(LOYALTY.stamps.every(s=>s)) rewardUnlocked = true;
  }
  // Bonus points when a reward is unlocked
  if(rewardUnlocked) LOYALTY.points += 100;
}
async function addBooking(){
  bookingIdCounter++;
  const sv=currentServices()[bkSel.service];
  const brb=bkSel.staff===-1?'Any':(currentTeam()[bkSel.staff]?.name||'Any');
  const biz=getBusinesses().find(x=>x.id===S.bizId)||getBusinesses()[0]||BIZ[0];
  const dt=DATES[bkSel.date];
  const newBooking={
    id:Date.now(),bizId:biz.id,cid:biz.cid,business:biz.name,
    service:sv?.name||'Service',staff:brb,
    date:dt?.sub||'Today',iso:dt?.iso||'',label:dt?.label||'',time:bkSel.slot||'',
    price:sv?.price||'',status:'upcoming',
    loc:biz.loc,payment:bkSel.payment
  };
  // Prevent double-booking: check backend first, then rely on the unique-index guard on insert.
  const taken = await isSlotTakenBackend(newBooking.bizId, newBooking.staff, newBooking.iso, newBooking.time);
  if (taken) { showToast('This slot is already booked'); return false; }
  const backendResult = await saveBookingToBackend(newBooking);
  if (backendResult === 'slot_taken') { return false; }
  // Keep the local booking as before (guest mode / offline fallback).
  userBookings.unshift(newBooking);
  earnLoyalty();
  // If Supabase actually saved the row, remember its id and reload from backend so
  // My Bookings (and the dashboard, when open) reflect the real persisted row.
  if (backendResult && backendResult.id) {
    newBooking.backendId = backendResult.id;
    await loadMyBookingsFromBackend();
  }
  takenSlotsKey = ''; // a slot was just taken -> force a fresh taken-slots load next time the picker shows
  render();
  return true;
}
function rescheduleBooking(id){
  reschedulingId=id;
  const b=userBookings.find(x=>x.id===id);
  if(b){refreshDates();S.bizId=b.bizId;S.screen='booking';bkStep=3;bkSel={service:0,staff:-1,date:null,slot:null,payment:b.payment||'cash',note:''};render();}
}
function setRating(bizId,n){
  selectedRatings[bizId]=n;
  renderInPlace();
}
function saveEdit(field,value){
  if(value.trim()) userProfile[field]=value.trim();
  editField=null;
  showToast('Profile updated','✓');
  render();
}
function toggleSave(id){if(savedIds.has(id)){savedIds.delete(id);showToast('Removed from saved','♡');}else{savedIds.add(id);showToast('Saved to favourites','♥');}renderInPlace();}
function rebookFrom(id){
  const b=userBookings.find(x=>x.id===id);
  if(b){refreshDates();S.bizId=b.bizId;S.screen='booking';bkStep=1;bkSel={service:null,staff:null,date:null,slot:null,payment:'cash',note:''};render();}
}

render();
initAuth();
loadBackendData().then(() => { loadMyBookingsFromBackend(); });

</script>
